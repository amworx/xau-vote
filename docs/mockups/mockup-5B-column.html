<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XAU Radar — Mockup 5B: Column</title>
<style>
  /* ══════════ MOCKUP 5B: COLUMN ══════════
     Verdict-first editorial column. Giant LONG + strength open the
     screen; a thin chart strip proves it; every level (Entry, Stop,
     TP1, TP2, TP3) gets its own ledger row with R:R.
     Fully static — zero animation of any kind. */
  :root{
    --bg:#090C13;
    --text:#ECEFF7;
    --dim:#8E9DB9;
    --faint:#5C6A87;
    --gold:#E3B23E;
    --gold-bright:#F5CC60;
    --long:#3BD09A;
    --short:#E85D5D;
    --info:#5E9BFF;
    --hair:#1B2540;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#04060B;color:var(--text);
    display:flex;justify-content:center;min-height:100vh;
    font-feature-settings:"tnum" 1;
  }
  .phone{width:390px;max-width:100%;min-height:844px;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}

  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 4px;font-size:.74rem;color:var(--dim)}
  .statusbar .right{display:flex;gap:6px;align-items:center}

  header{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 4px}
  .brand .name{font-size:.9rem;font-weight:800;letter-spacing:.14em}
  .brand .name span{color:var(--gold)}
  .hdr{display:flex;align-items:center;gap:9px}
  .hdr .p{font-family:var(--mono);font-size:1rem;font-weight:700}
  .hdr .c{font-family:var(--mono);font-size:.66rem;font-weight:600;color:var(--long)}
  .live{display:flex;align-items:center;gap:6px;font-size:.6rem;font-weight:700;letter-spacing:.12em;color:var(--long);min-height:44px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--long)}

  main{flex:1;display:flex;flex-direction:column;padding:6px 24px 12px}

  .tf{font-size:.62rem;font-weight:700;letter-spacing:.24em;color:var(--faint);text-transform:uppercase}
  .word{
    font-size:4.6rem;font-weight:800;letter-spacing:.02em;line-height:1.05;
    color:var(--gold-bright);margin-top:2px;
    display:flex;align-items:center;gap:14px;
  }
  .word svg{width:44px;height:44px;stroke:var(--gold-bright);flex-shrink:0}
  .agree{font-size:.78rem;color:var(--dim);margin-top:6px}
  .agree b{color:var(--text);font-family:var(--mono)}

  .strength{display:flex;align-items:baseline;gap:10px;margin-top:14px}
  .strength .v{font-size:.82rem;font-weight:800;letter-spacing:.12em;color:var(--gold-bright)}
  .strength .n{font-family:var(--mono);font-size:.7rem;color:var(--dim)}
  .track{position:relative;flex:1;height:5px;border-radius:3px;background:#232E4D}
  .fill{position:absolute;top:0;left:0;bottom:0;width:82%;border-radius:3px;background:var(--gold)}

  .strip{position:relative;height:118px;margin-top:16px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  #strip{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ledger: one row per level */
  .ledger{margin-top:6px}
  .row{
    display:flex;align-items:baseline;gap:10px;
    padding:11px 0;min-height:44px;
    border-bottom:1px solid var(--hair);
  }
  .row .k{font-size:.62rem;font-weight:700;letter-spacing:.2em;color:var(--faint);width:64px;flex-shrink:0}
  .row .v{font-family:var(--mono);font-size:1rem;font-weight:700;flex:1}
  .row .rr{font-family:var(--mono);font-size:.66rem;color:var(--faint)}
  .row.entry .v{color:var(--info)}
  .row.sl .v{color:var(--short)}
  .row.tp .v{color:var(--long)}

  .cta{
    margin-top:16px;width:100%;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold));color:#1C1503;
    border:none;border-radius:13px;
    font-weight:800;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;
    padding:15px;min-height:52px;cursor:pointer;
  }
  .cta:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
  .micro{margin-top:10px;text-align:center;font-size:.62rem;color:var(--faint);letter-spacing:.06em}
  .micro .ok{color:var(--long)}
  .micro .wait{color:var(--gold-bright)}

  nav{display:flex;border-top:1px solid var(--hair);background:rgba(9,12,19,.96);padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
  nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;color:var(--faint);text-decoration:none;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;min-height:44px;border-radius:8px}
  nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  nav a.active{color:var(--gold-bright)}
  nav a.active svg{stroke:var(--gold-bright)}
  nav a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>21:47</span><span class="right">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
    <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
  </span></div>

  <header>
    <div class="brand"><div class="name">XAU<span>RADAR</span></div></div>
    <div class="hdr">
      <span class="p">4,278.30</span><span class="c">+12.40</span>
      <span class="live" role="status" aria-label="Live"><i aria-hidden="true"></i>LIVE</span>
    </div>
  </header>

  <main>
    <div class="tf">15M Consensus</div>
    <div class="word">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      LONG
    </div>
    <div class="agree"><b>4/5</b> sources agree</div>

    <div class="strength">
      <span class="v">STRONG</span>
      <div class="track" role="img" aria-label="Consensus strength 82 out of 100, strong"><div class="fill"></div></div>
      <span class="n">82/100</span>
    </div>

    <div class="strip">
      <canvas id="strip" role="img" aria-label="Price strip: entry zone 4275 to 4280, stop 4262, first target 4295."></canvas>
    </div>

    <div class="ledger">
      <div class="row entry"><span class="k">ENTRY</span><span class="v">4,275 – 4,280</span><span class="rr">zone</span></div>
      <div class="row sl"><span class="k">STOP</span><span class="v">4,262</span><span class="rr">−16 pts</span></div>
      <div class="row tp"><span class="k">TP1</span><span class="v">4,295</span><span class="rr">1 : 1.5</span></div>
      <div class="row tp"><span class="k">TP2</span><span class="v">4,315</span><span class="rr">1 : 3.0</span></div>
      <div class="row tp"><span class="k">TP3</span><span class="v">4,340</span><span class="rr">1 : 4.1</span></div>
    </div>

    <button class="cta" type="button">View Full Setup
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <div class="micro">1H <span class="ok">SUPPORTIVE</span> · 5M <span class="wait">READY</span> · updated 14s ago</div>
  </main>

  <nav aria-label="Primary">
    <a href="#" class="active" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>Radar</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Signal</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Sources</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>History</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.23.6.83 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>Settings</a>
  </nav>
</div>

<script>
(function(){
  var cv = document.getElementById('strip');
  var ctx = cv.getContext('2d');
  var P_MIN = 4255, P_MAX = 4300;
  var ENTRY_LO = 4275, ENTRY_HI = 4280, SL = 4262, TP1 = 4295;
  var N = 70, prices = [];
  (function seed(){
    var p = 4259;
    for (var i = 0; i < N; i++){
      p += (Math.sin(i*.3)*.35 + (Math.random()-.42)*.9 + .18);
      if (p < 4257) p = 4257 + Math.random();
      if (p > 4284) p = 4284 - Math.random();
      prices.push(p);
    }
  })();
  function size(){
    var r = cv.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function y(p, H){ var pad = 10; return pad + (1 - (p - P_MIN) / (P_MAX - P_MIN)) * (H - pad*2); }
  function draw(){
    var W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0,0,W,H);
    var ey1 = y(ENTRY_HI,H), ey2 = y(ENTRY_LO,H);
    ctx.fillStyle = 'rgba(227,178,62,.13)'; ctx.fillRect(0,ey1,W,ey2-ey1);
    ctx.strokeStyle = 'rgba(232,93,93,.7)'; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(0,y(SL,H)); ctx.lineTo(W,y(SL,H)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(59,208,154,.55)'; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(0,y(TP1,H)); ctx.lineTo(W,y(TP1,H)); ctx.stroke();
    ctx.setLineDash([]);
    var x = function(i){ return 4 + (W-8) * i/(N-1); };
    ctx.strokeStyle = '#E3B23E'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.beginPath();
    for (var i = 0; i < N; i++){ var px = x(i), py = y(prices[i],H); i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); }
    ctx.stroke();
    var lx = x(N-1), ly = y(prices[N-1],H);
    ctx.fillStyle = '#E3B23E'; ctx.beginPath(); ctx.arc(lx,ly,3.5,0,7); ctx.fill();
  }
  size(); window.addEventListener('resize', draw); draw();
})();
</script>
</body>
</html>
