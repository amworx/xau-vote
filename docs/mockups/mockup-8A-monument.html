<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XAU Radar — Mockup 8A: Monument</title>
<style>
  /* ══════════ MOCKUP 8A: MONUMENT ══════════
     Brutalist oversized type. The verdict is architecture.
     Sources are a tug-of-war mass bar. Fully static. */
  :root{
    --bg:#0B0B0C;
    --text:#F2F0EA;
    --dim:#8F8C83;
    --faint:#55534C;
    --gold:#E8B93C;
    --long:#3BD09A;
    --short:#E85D5D;
    --info:#6AA5FF;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    font-family:"Archivo","Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#000;color:var(--text);
    display:flex;justify-content:center;min-height:100vh;
  }
  .phone{width:390px;max-width:100%;min-height:844px;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}

  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 4px;font-size:.74rem;color:var(--dim);font-family:"Inter",sans-serif}
  .statusbar .right{display:flex;gap:6px;align-items:center}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 0}
  .brand .name{font-size:.85rem;font-weight:800;letter-spacing:.14em}
  .brand .name span{color:var(--gold)}
  .live{display:flex;align-items:center;gap:6px;font-size:.62rem;font-weight:700;letter-spacing:.14em;color:var(--long);min-height:44px}
  .live i{width:7px;height:7px;background:var(--long)}

  main{flex:1;display:flex;flex-direction:column;padding:4px 20px 12px}
  .price{font-family:var(--mono);font-size:.85rem;color:var(--dim);margin-top:6px}
  .pnl{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.12em;color:var(--long);border:1px solid var(--long);border-radius:4px;padding:3px 8px;margin-left:10px;vertical-align:2px;white-space:nowrap}
  .price b{color:var(--text);font-size:1.05rem}
  /* the monument */
  .word{
    font-size:5.9rem;font-weight:900;letter-spacing:-.02em;line-height:.95;
    color:var(--long);margin-top:8px;
  }
  .word .ghost{
    display:block;color:transparent;-webkit-text-stroke:1.5px var(--faint);
    font-size:2.1rem;letter-spacing:.3em;margin-top:6px;
  }
  /* tug of war */
  .tug{display:flex;height:44px;margin-top:16px;border-radius:6px;overflow:hidden}
  .tug i{display:block;height:100%}
  .tug .y{background:var(--long);flex:4}
  .tug .n{background:var(--short);flex:1}
  .tugcap{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--mono);font-size:.66rem;color:var(--dim)}
  .tugcap b{color:var(--text)}
  .tugcap .s{color:var(--gold);font-weight:700}
  /* massive rows */
  .rows{margin-top:14px;border-top:3px solid var(--text)}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:13px 0;border-bottom:1px solid #262624;min-height:44px}
  .row .k{font-size:.72rem;font-weight:800;letter-spacing:.2em;color:var(--dim)}
  .row .v{font-family:var(--mono);font-size:1.35rem;font-weight:700}
  .row .rv{display:flex;flex-direction:column;align-items:flex-end}
  .row .pp{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--faint);margin-top:4px}
  .share-row{display:flex;gap:10px;margin-top:12px}
  .ghost{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px solid #3A3A38;color:var(--text);border-radius:6px;font-family:var(--mono);font-weight:700;font-size:.72rem;letter-spacing:.1em;padding:13px;min-height:48px;cursor:pointer}
  .ghost svg{width:15px;height:15px;flex-shrink:0}
  .ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .row.entry .v{color:var(--info)}
  .row.sl .v{color:var(--short)}
  .row.tp .v{color:var(--long)}
  .cta{
    margin-top:auto;width:100%;background:var(--gold);color:#191304;border:none;
    font-weight:900;font-size:1rem;letter-spacing:.14em;
    padding:18px;min-height:58px;cursor:pointer;
  }
  .cta:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .micro{margin-top:10px;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--faint);text-align:center}
  .micro .ok{color:var(--long)}
  .micro .wait{color:var(--gold)}
  nav{display:flex;border-top:3px solid var(--text);background:#0B0B0C;padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
  nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;color:var(--faint);text-decoration:none;font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.12em;min-height:48px;min-width:48px}
  nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
  nav a.active{color:var(--gold)}
  nav a.active svg{stroke:var(--gold)}
  nav a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>21:47</span><span class="right">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
    <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
  </span></div>
  <header>
    <div class="brand"><div class="name">XAU<span>RADAR</span></div></div>
    <span class="live" role="status" aria-label="Live"><i aria-hidden="true"></i>LIVE · 15M</span>
  </header>
  <main>
    <div class="price">XAUUSD <b>4,278.30</b> +12.40<span class="pnl">● IN-PROFIT +3 PIPS</span></div>
    <div class="word">LONG<span class="ghost">STRONG 82/100</span></div>
    <div class="tug" role="img" aria-label="4 of 5 sources agree long, 1 disagrees"><i class="y"></i><i class="n"></i></div>
    <div class="tugcap"><span><b>4/5</b> AGREE</span><span class="s">STRONG · 82/100</span></div>
    <div class="rows">
      <div class="row entry"><span class="k">ENTRY</span><span class="rv"><span class="v">4,275–80</span><span class="pp">50-PIP ZONE</span></span></div>
      <div class="row sl"><span class="k">STOP</span><span class="rv"><span class="v">4,262</span><span class="pp">−160 PIPS</span></span></div>
      <div class="row tp"><span class="k">TARGETS</span><span class="rv"><span class="v">4,295 +</span><span class="pp">+170 – +620 PIPS</span></span></div>
    </div>
    <button class="cta" type="button">VIEW FULL SETUP →</button>
    <div class="share-row">
      <button class="ghost" id="copyBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy</button>
      <button class="ghost" id="shareBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg>Share</button>
    </div>
    <div class="micro">1H <span class="ok">SUPPORTIVE</span> · 5M <span class="wait">READY</span> · 14S AGO</div>
  </main>
  <nav aria-label="Primary">
    <a href="#" class="active" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V10M12 20V4M18 20v-8"/></svg>RADAR</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>SIGNAL</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/></svg>SOURCES</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>HISTORY</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="16" r="2"/></svg>CONFIG</a>
  </nav>
</div>
<script>
(function(){
  var TEXT = 'XAUUSD 15M — LONG\nEntry 4,275–4,280\nSL 4,262 (−160 pips)\nTP1 4,295 (+170) · TP2 4,315 (+370) · TP3 4,340 (+620)\nConsensus STRONG 82/100 · 4/5 agree\n— via XAU Radar';
  var copyBtn = document.getElementById('copyBtn');
  var shareBtn = document.getElementById('shareBtn');
  function flash(btn, msg){ var old = btn.innerHTML; btn.innerHTML = msg; setTimeout(function(){ btn.innerHTML = old; }, 1600); }
  function copyText(t, ok){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); ok();
    }
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok, fallback); }
    else { fallback(); }
  }
  copyBtn.addEventListener('click', function(){ copyText(TEXT, function(){ flash(copyBtn, 'Copied ✓'); }); });
  shareBtn.addEventListener('click', function(){
    if (navigator.share){ navigator.share({ title: 'XAU Radar signal', text: TEXT }).catch(function(){}); }
    else { copyText(TEXT, function(){ flash(shareBtn, 'Copied ✓'); }); }
  });
})();
</script>
</body>
</html>
