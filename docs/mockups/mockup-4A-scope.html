<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XAU Radar — Mockup 4A: Scope</title>
<style>
  /* ══════════ MOCKUP 4A: SCOPE ══════════
     FUSION 1 — Orbit × Chart: the orbit dial floats OVER a live
     full-bleed price chart. Radial instrument on price terrain.
     Motion: price line draws behind; blips orbit; arc draws in. */
  :root{
    --bg:#070B13;
    --text:#EBF0FA;
    --dim:#8E9FBE;
    --faint:#5A6B8C;
    --gold:#E3B23E;
    --gold-bright:#F5CC60;
    --long:#3BD09A;
    --short:#E85D5D;
    --info:#5E9BFF;
    --track:#1B2540;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#04060B;color:var(--text);
    display:flex;justify-content:center;min-height:100vh;
    font-feature-settings:"tnum" 1;
  }
  .phone{width:390px;max-width:100%;min-height:844px;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}

  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-size:.74rem;color:var(--dim);position:relative;z-index:3}
  .statusbar .right{display:flex;gap:6px;align-items:center}

  header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 6px;position:relative;z-index:3}
  .brand .name{font-size:.9rem;font-weight:800;letter-spacing:.14em}
  .brand .name span{color:var(--gold)}
  .hdr{display:flex;align-items:center;gap:9px}
  .hdr .p{font-family:var(--mono);font-size:1rem;font-weight:700}
  .hdr .c{font-family:var(--mono);font-size:.66rem;font-weight:600;color:var(--long)}
  .live{display:flex;align-items:center;gap:6px;font-size:.6rem;font-weight:700;letter-spacing:.12em;color:var(--long);min-height:44px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--long);box-shadow:0 0 8px rgba(59,208,154,.9);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.live i,.orbit-ring,.arc-fill{animation:none!important}}

  main{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;padding:2px 20px 12px}
  #bg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}

  .tf{font-size:.64rem;font-weight:700;letter-spacing:.24em;color:var(--faint);text-transform:uppercase;margin-top:6px;position:relative;z-index:2}

  .dial{position:relative;width:300px;height:300px;margin-top:0;flex-shrink:0;z-index:2}
  .dial::before{
    content:"";position:absolute;inset:-24px;border-radius:50%;
    background:radial-gradient(circle,rgba(7,11,19,.88) 55%,rgba(7,11,19,.35) 72%,transparent 75%);
  }
  .dial svg.face{position:absolute;inset:0;width:100%;height:100%}
  .arc-fill{stroke-dasharray:541 880;animation:draw 1.6s ease-out both}
  @keyframes draw{from{stroke-dasharray:0 880}to{stroke-dasharray:541 880}}
  .orbit-ring{position:absolute;inset:14px;animation:spin 26s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blip{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
  .blip.agree{background:var(--long);box-shadow:0 0 9px rgba(59,208,154,.95)}
  .blip.dissent{background:var(--short);box-shadow:0 0 9px rgba(232,93,93,.9)}
  .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
  .core svg{width:24px;height:24px;stroke:var(--gold-bright)}
  .core .word{font-size:1.9rem;font-weight:800;letter-spacing:.1em;color:var(--gold-bright);line-height:1}
  .core .sub{font-size:.7rem;color:var(--dim);margin-top:4px}
  .core .sub b{color:var(--text);font-family:var(--mono)}
  .core .str{font-size:.66rem;font-weight:800;letter-spacing:.14em;color:var(--gold-bright);margin-top:7px}
  .core .str span{font-family:var(--mono);font-weight:600}

  .sat{
    position:absolute;z-index:2;
    display:flex;align-items:center;gap:7px;
    background:rgba(10,15,26,.94);
    border:1px solid var(--track);
    border-radius:999px;
    padding:8px 13px;
    font-family:var(--mono);font-size:.74rem;font-weight:700;white-space:nowrap;
  }
  .sat i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .sat.entry{top:7%;right:-6px}
  .sat.entry i{background:var(--info);box-shadow:0 0 7px rgba(94,155,255,.9)}
  .sat.entry span{color:var(--info)}
  .sat.tp{bottom:17%;left:-10px}
  .sat.tp i{background:var(--long);box-shadow:0 0 7px rgba(59,208,154,.9)}
  .sat.tp span{color:var(--long)}
  .sat.sl{bottom:1%;right:5%}
  .sat.sl i{background:var(--short);box-shadow:0 0 7px rgba(232,93,93,.9)}
  .sat.sl span{color:var(--short)}
  .sat small{color:var(--faint);font-weight:600;font-size:.6rem;letter-spacing:.08em}

  .micro{margin-top:10px;text-align:center;font-size:.64rem;color:var(--faint);letter-spacing:.06em;position:relative;z-index:2}
  .micro .ok{color:var(--long)}
  .micro .wait{color:var(--gold-bright)}

  .cta{
    margin-top:12px;width:100%;position:relative;z-index:2;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold));color:#1C1503;
    border:none;border-radius:14px;
    font-weight:800;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;
    padding:15px;min-height:52px;cursor:pointer;
    box-shadow:0 10px 26px -10px rgba(227,178,62,.5);
    transition:filter .18s ease,transform .18s ease;
  }
  .cta:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .cta:active{transform:translateY(0)}
  .cta:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}

  nav{display:flex;border-top:1px solid #16203A;background:rgba(8,12,21,.94);backdrop-filter:blur(12px);padding:6px 8px calc(10px + env(safe-area-inset-bottom));margin-top:12px;position:relative;z-index:3}
  nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;color:var(--faint);text-decoration:none;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;min-height:44px;border-radius:8px;transition:color .2s ease}
  nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  nav a.active{color:var(--gold-bright)}
  nav a.active svg{stroke:var(--gold-bright)}
  nav a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>21:47</span><span class="right">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
    <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
  </span></div>

  <header>
    <div class="brand"><div class="name">XAU<span>RADAR</span></div></div>
    <div class="hdr">
      <span class="p">4,278.30</span><span class="c">+12.40</span>
      <span class="live" role="status" aria-label="Live"><i aria-hidden="true"></i>LIVE</span>
    </div>
  </header>

  <main>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="tf">15M Consensus</div>

    <div class="dial" role="img" aria-label="LONG consensus, strong 82 of 100, 4 of 5 sources agree. Entry 4275 to 4280, stop 4262, targets from 4295.">
      <svg class="face" viewBox="0 0 330 330" fill="none" aria-hidden="true">
        <circle cx="165" cy="165" r="158" stroke="#232F52" stroke-width="6" stroke-dasharray="2 8.31" opacity=".7"/>
        <circle cx="165" cy="165" r="140" stroke="#1B2540" stroke-width="11" stroke-dasharray="660 880" stroke-linecap="round" transform="rotate(135 165 165)"/>
        <circle class="arc-fill" cx="165" cy="165" r="140" stroke="url(#gg)" stroke-width="11" stroke-linecap="round" transform="rotate(135 165 165)"/>
        <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#B98A2B"/><stop offset="1" stop-color="#F5CC60"/>
        </linearGradient></defs>
        <circle cx="165" cy="165" r="104" stroke="#22304F" stroke-width="1"/>
        <path d="M165 45l5 9h-10l5-9z" fill="#F5CC60"/>
        <path d="M165 7v12M165 311v12M7 165h12M311 165h12" stroke="#2A3A61" stroke-width="1.5"/>
      </svg>
      <div class="orbit-ring" aria-hidden="true">
        <i class="blip agree" style="width:11px;height:11px;left:50%;top:0%"></i>
        <i class="blip agree" style="width:9px;height:9px;left:93%;top:24%"></i>
        <i class="blip agree" style="width:8px;height:8px;left:86%;top:72%"></i>
        <i class="blip agree" style="width:8px;height:8px;left:22%;top:88%"></i>
        <i class="blip dissent" style="width:9px;height:9px;left:4%;top:44%"></i>
      </div>
      <div class="core">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <div class="word">LONG</div>
        <div class="sub"><b>4/5</b> agree</div>
        <div class="str">STRONG <span>82/100</span></div>
      </div>
      <div class="sat entry"><i></i><small>ENTRY</small><span>4,275–80</span></div>
      <div class="sat tp"><i></i><small>TARGETS</small><span>4,295 +</span></div>
      <div class="sat sl"><i></i><small>STOP</small><span>4,262</span></div>
    </div>

    <div class="micro">1H <span class="ok">SUPPORTIVE</span> · 5M <span class="wait">READY</span> · updated 14s ago</div>

    <button class="cta" type="button">View Full Setup
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </main>

  <nav aria-label="Primary">
    <a href="#" class="active" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>Radar</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Signal</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Sources</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>History</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.23.6.83 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>Settings</a>
  </nav>
</div>

<script>
(function(){
  var cv = document.getElementById('bg');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // backdrop terrain: wide range so the line drifts across the whole main area
  var P_MIN = 4240, P_MAX = 4310;
  var ENTRY_LO = 4275, ENTRY_HI = 4280, SL = 4262, TP1 = 4295;
  var N = 110;
  var prices = [];
  (function seed(){
    var p = 4248;
    for (var i = 0; i < N; i++){
      p += (Math.sin(i*.22)*.5 + (Math.random()-.40)*1.1 + .22);
      if (p < 4244) p = 4244 + Math.random();
      if (p > 4292) p = 4292 - Math.random();
      prices.push(p);
    }
  })();
  function size(){
    var r = cv.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function y(p, H){ return 14 + (1 - (p - P_MIN) / (P_MAX - P_MIN)) * (H - 28); }
  function draw(progress){
    var W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(120,140,175,.07)'; ctx.lineWidth = 1;
    for (var g = 1; g < 6; g++){ var gy = H*g/6; ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
    var ey1 = y(ENTRY_HI,H), ey2 = y(ENTRY_LO,H);
    ctx.fillStyle = 'rgba(227,178,62,.07)'; ctx.fillRect(0,ey1,W,ey2-ey1);
    ctx.strokeStyle = 'rgba(232,93,93,.30)'; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(0,y(SL,H)); ctx.lineTo(W,y(SL,H)); ctx.stroke();
    ctx.strokeStyle = 'rgba(59,208,154,.30)'; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(0,y(TP1,H)); ctx.lineTo(W,y(TP1,H)); ctx.stroke();
    ctx.setLineDash([]);
    var count = Math.max(2, Math.floor(N * progress));
    var x = function(i){ return (W-8) * i/(N-1) + 4; };
    var lg = ctx.createLinearGradient(0,0,W,0);
    lg.addColorStop(0,'rgba(94,155,255,.12)'); lg.addColorStop(1,'rgba(227,178,62,.55)');
    ctx.strokeStyle = lg; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.beginPath();
    for (var i = 0; i < count; i++){ var px = x(i), py = y(prices[i],H); i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); }
    ctx.stroke();
    var lx = x(count-1), ly = y(prices[count-1],H);
    ctx.fillStyle = 'rgba(227,178,62,.8)'; ctx.beginPath(); ctx.arc(lx,ly,3,0,7); ctx.fill();
  }
  size(); window.addEventListener('resize', function(){ size(); draw(1); });
  if (reduce){ draw(1); return; }
  var start = null;
  function frame(ts){
    if (!start) start = ts;
    var p = Math.min(1, (ts - start) / 3200);
    draw(p);
    if (p < 1) requestAnimationFrame(frame);
    else setTimeout(function(){ start = null; requestAnimationFrame(frame); }, 3000);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
