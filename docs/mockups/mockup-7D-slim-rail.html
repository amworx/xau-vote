<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XAU Radar — Mockup 7D: Slim Rail</title>
<style>
  /* ══════════ MOCKUP 7D: SLIM RAIL ══════════
     Rail variant 4 — a 76px M3-style slim rail (verdict + vertical
     strength meter) beside a card column. Narrowest rail tested.
     Fully static. */
  :root{
    --bg:#0A0C11;
    --text:#EDF0F7;
    --dim:#8E9CBB;
    --faint:#5B6884;
    --gold:#E5B93F;
    --gold-bright:#F7D266;
    --gold-ink:#231A05;
    --long:#3BD09A;
    --short:#E85D5D;
    --info:#5E9BFF;
    --card:#121826;
    --line:#1D2742;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#04060B;color:var(--text);
    display:flex;justify-content:center;min-height:100vh;
    font-feature-settings:"tnum" 1;
  }
  .phone{width:390px;max-width:100%;min-height:844px;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}

  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-size:.74rem;color:var(--dim)}
  .statusbar .right{display:flex;gap:6px;align-items:center}

  header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 10px}
  .brand .name{font-size:.9rem;font-weight:800;letter-spacing:.14em}
  .brand .name span{color:var(--gold)}
  .live{display:flex;align-items:center;gap:6px;font-size:.6rem;font-weight:700;letter-spacing:.12em;color:var(--long);min-height:44px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--long)}

  .split{flex:1;display:flex;min-height:0}
  /* slim rail */
  .srail{
    width:76px;flex-shrink:0;
    background:linear-gradient(180deg,#1B2233,#121828);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;
    padding:16px 0;gap:10px;
  }
  .srail .pill{
    width:52px;height:52px;border-radius:16px;flex-shrink:0;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold));
    display:flex;align-items:center;justify-content:center;
  }
  .srail .pill svg{width:24px;height:24px;stroke:var(--gold-ink)}
  .srail .word{writing-mode:vertical-rl;transform:rotate(180deg);font-size:1.05rem;font-weight:800;letter-spacing:.24em;color:var(--gold-bright)}
  .srail .vtrack{position:relative;flex:1;width:6px;border-radius:3px;background:#232E4D;min-height:60px;margin:4px 0}
  .srail .vfill{position:absolute;left:0;right:0;bottom:0;height:82%;border-radius:3px;background:var(--gold)}
  .srail .n{font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--gold-bright)}

  .col{flex:1;display:flex;flex-direction:column;gap:8px;padding:2px 16px 10px 12px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
  .card .h{font-size:.6rem;font-weight:700;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
  .card.price .v{font-family:var(--mono);font-size:1.55rem;font-weight:700;margin-top:5px}
  .card.price .v small{font-size:.72rem;color:var(--long);margin-left:8px}
  .card.price .t{font-size:.6rem;color:var(--faint);margin-top:4px;letter-spacing:.06em}
  .card.srcs .row{display:flex;gap:6px;margin-top:9px}
  .card.srcs .row i{flex:1 1 0;font-style:normal;font-family:var(--mono);font-size:.62rem;font-weight:700;text-align:center;background:rgba(59,208,154,.1);color:var(--long);border:1px solid rgba(59,208,154,.3);border-radius:8px;padding:7px 0}
  .card.srcs .row i.no{background:rgba(232,93,93,.1);color:var(--short);border-color:rgba(232,93,93,.3)}
  .card.lvls .r{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;min-height:44px}
  .card.lvls .r + .r{border-top:1px solid var(--line)}
  .card.lvls .k{font-size:.58rem;font-weight:700;letter-spacing:.16em;color:var(--faint)}
  .card.lvls .v{font-family:var(--mono);font-size:.9rem;font-weight:700}
  .card.lvls .entry .v{color:var(--info)}
  .card.lvls .sl .v{color:var(--short)}
  .card.lvls .tp .v{color:var(--long)}

  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--gold);color:var(--gold-ink);
    border:none;border-radius:14px;
    font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;
    padding:14px;min-height:52px;cursor:pointer;
  }
  .cta:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
  .micro{text-align:center;font-size:.58rem;color:var(--faint);letter-spacing:.06em}
  .micro .ok{color:var(--long)}
  .micro .wait{color:var(--gold-bright)}

  nav{display:flex;border-top:1px solid var(--line);background:rgba(9,11,17,.96);padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
  nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;color:var(--faint);text-decoration:none;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;min-height:48px;min-width:48px;border-radius:8px}
  nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  nav a.active{color:var(--gold-bright)}
  nav a.active svg{stroke:var(--gold-bright)}
  nav a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>21:47</span><span class="right">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
    <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
  </span></div>

  <header>
    <div class="brand"><div class="name">XAU<span>RADAR</span></div></div>
    <span class="live" role="status" aria-label="Live"><i aria-hidden="true"></i>LIVE</span>
  </header>

  <div class="split">
    <div class="srail" role="img" aria-label="Verdict LONG, strength 82 of 100">
      <div class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </div>
      <div class="word">LONG</div>
      <div class="vtrack" aria-hidden="true"><div class="vfill"></div></div>
      <div class="n">82</div>
    </div>

    <div class="col">
      <div class="card price">
        <div class="h">Gold · XAUUSD · 15M</div>
        <div class="v">4,278.30<small>+12.40</small></div>
        <div class="t">21:47:12 · spread 0.35</div>
      </div>

      <div class="card srcs">
        <div class="h">Sources · 4/5 agree</div>
        <div class="row" role="img" aria-label="Sources A, B, C and E agree; D disagrees">
          <i>A✓</i><i>B✓</i><i>C✓</i><i>E✓</i><i class="no">D✗</i>
        </div>
      </div>

      <div class="card lvls">
        <div class="r entry"><span class="k">ENTRY</span><span class="v">4,275–80</span></div>
        <div class="r sl"><span class="k">STOP</span><span class="v">4,262</span></div>
        <div class="r tp"><span class="k">TARGETS</span><span class="v">4,295 +</span></div>
      </div>

      <button class="cta" type="button">Full Setup →</button>
      <div class="micro">1H <span class="ok">SUPP</span> · 5M <span class="wait">READY</span> · 14s</div>
    </div>
  </div>

  <nav aria-label="Primary">
    <a href="#" class="active" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>Radar</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Signal</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Sources</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>History</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 12a8 8 0 0 1 16 0"/></svg>Config</a>
  </nav>
</div>
</body>
</html>
