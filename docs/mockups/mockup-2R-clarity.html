<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XAU Radar — Mockup 2R: Clarity</title>
<style>
  /* ══════════ MOCKUP 2R: CLARITY ══════════
     Strict vertical priority. One question per zone:
       1. What's the call?      → giant direction, zero competition
       2. How strong?           → one strength line
       3. Where in / out?       → exactly 3 numbers
     Price demoted to the header. Everything else → Signal screen.
     Radar sweep kept, but small, inside the hero — not a section. */
  :root{
    --bg:#0A0F1A;
    --surface:#131B2B;
    --border:#233252;
    --border-soft:#1A2440;
    --text:#ECF1FA;
    --dim:#94A5C6;
    --faint:#5C6E92;
    --gold:#E0AE3C;
    --gold-bright:#F4C95A;
    --gold-dim:rgba(224,174,60,.12);
    --long:#35C797;
    --long-dim:rgba(53,199,151,.12);
    --short:#E8555A;
    --info:#5B96FF;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#04060C;color:var(--text);
    display:flex;justify-content:center;min-height:100vh;
    font-feature-settings:"tnum" 1;
  }
  .phone{
    width:390px;max-width:100%;min-height:844px;
    background:var(--bg);position:relative;
    display:flex;flex-direction:column;overflow:hidden;
  }

  .statusbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px 4px;font-size:.74rem;color:var(--dim);
  }
  .statusbar .right{display:flex;gap:6px;align-items:center}

  /* ── compact header: brand + LIVE + price inline ── */
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 20px 12px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex;flex-direction:column;gap:1px}
  .brand .name{font-size:.92rem;font-weight:800;letter-spacing:.14em}
  .brand .name span{color:var(--gold)}
  .hdr-price{
    display:flex;align-items:center;gap:10px;
  }
  .hdr-price .p{
    font-family:var(--mono);font-size:1.02rem;font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .hdr-price .c{
    font-family:var(--mono);font-size:.68rem;font-weight:600;
    color:var(--long);background:var(--long-dim);
    padding:2px 7px;border-radius:5px;
  }
  .live{
    display:flex;align-items:center;gap:6px;
    font-size:.62rem;font-weight:700;letter-spacing:.12em;color:var(--long);
    min-height:44px;padding:0 2px;
  }
  .live i{
    width:7px;height:7px;border-radius:50%;background:var(--long);
    box-shadow:0 0 8px rgba(53,199,151,.9);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.live i{animation:none}.sweep{animation:none!important}}

  main{flex:1;display:flex;flex-direction:column;padding:8px 20px 14px}

  /* ══ ZONE 1 — THE CALL (hero, owns the screen) ══ */
  .hero{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
    position:relative;
    min-height:300px;
  }
  .hero .tf{
    font-size:.68rem;font-weight:700;letter-spacing:.22em;color:var(--faint);
    text-transform:uppercase;
  }
  .hero-stage{position:relative;width:230px;height:230px;margin:4px 0}
  .radar-svg{position:absolute;inset:0;width:100%;height:100%}
  .sweep{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from -25deg at 50% 50%,
      transparent 0deg,
      rgba(224,174,60,.02) 305deg,
      rgba(224,174,60,.25) 352deg,
      rgba(244,201,90,.5) 360deg);
    animation:sweep 6s linear infinite;
    -webkit-mask:radial-gradient(circle,transparent 16%,#000 17%);
    mask:radial-gradient(circle,transparent 16%,#000 17%);
  }
  @keyframes sweep{to{transform:rotate(360deg)}}
  .blip{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
  .blip.agree{background:var(--long);box-shadow:0 0 8px rgba(53,199,151,.9);width:8px;height:8px}
  .blip.agree.tiny{width:6px;height:6px;opacity:.85}
  .blip.dissent{background:var(--short);box-shadow:0 0 7px rgba(232,85,90,.75);width:7px;height:7px}
  .hero-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;
  }
  .hero-center svg{width:30px;height:30px;stroke:var(--gold-bright)}
  .hero-word{
    font-size:2.5rem;font-weight:800;letter-spacing:.1em;
    color:var(--gold-bright);line-height:1.05;
  }
  .hero-sub{
    font-size:.78rem;color:var(--dim);
  }
  .hero-sub b{color:var(--text);font-family:var(--mono);font-weight:700}

  /* ══ ZONE 2 — STRENGTH (one line, one breath) ══ */
  .strength{
    padding:6px 4px 2px;
  }
  .strength-top{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:8px;
  }
  .strength-top .lbl{font-size:.62rem;font-weight:700;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
  .strength-top .val{
    font-size:.8rem;font-weight:800;letter-spacing:.1em;color:var(--gold-bright);
  }
  .strength-top .val span{font-family:var(--mono);font-size:.74rem;margin-left:6px}
  .gauge-track{
    position:relative;height:7px;border-radius:4px;
    background:linear-gradient(90deg,
      rgba(232,85,90,.30) 0 39%,
      rgba(224,174,60,.26) 39% 59%,
      rgba(91,150,255,.22) 59% 74%,
      rgba(53,199,151,.32) 74% 89%,
      rgba(53,199,151,.58) 89% 100%);
  }
  .gauge-fill{
    position:absolute;top:0;left:0;bottom:0;width:82%;border-radius:4px;
    background:linear-gradient(90deg,rgba(244,201,90,.3),var(--gold));
  }
  .gauge-marker{
    position:absolute;top:-3.5px;bottom:-3.5px;left:82%;width:2.5px;
    background:var(--gold-bright);border-radius:2px;
    box-shadow:0 0 8px rgba(244,201,90,.85);
  }

  /* ══ ZONE 3 — THE NUMBERS (exactly three) ══ */
  .numbers{
    display:flex;gap:10px;
    margin-top:16px;
  }
  .num{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:13px 6px 11px;
    text-align:center;
    min-height:44px;
    position:relative;
  }
  .num::before{
    content:"";position:absolute;top:0;left:22%;right:22%;height:2.5px;
    border-radius:0 0 3px 3px;
  }
  .num.entry::before{background:var(--info)}
  .num.sl::before{background:var(--short)}
  .num.tp::before{background:var(--long)}
  .num .k{font-size:.58rem;font-weight:700;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  .num .v{
    font-family:var(--mono);font-size:.94rem;font-weight:700;margin-top:6px;
    font-variant-numeric:tabular-nums;
  }
  .num.entry .v{color:var(--info)}
  .num.sl .v{color:var(--short)}
  .num.tp .v{color:var(--long)}
  .num .s{font-size:.58rem;color:var(--faint);margin-top:3px;font-family:var(--mono)}

  /* ══ CTA ══ */
  .cta{
    margin-top:16px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold));
    color:#1C1503;border:none;border-radius:14px;
    font-weight:800;font-size:.86rem;letter-spacing:.12em;text-transform:uppercase;
    padding:16px;min-height:54px;cursor:pointer;
    box-shadow:0 10px 26px -10px rgba(224,174,60,.5);
    transition:filter .18s ease,transform .18s ease;
  }
  .cta:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .cta:active{transform:translateY(0)}
  .cta:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}

  /* micro line: context hint, one line only */
  .micro{
    margin-top:10px;text-align:center;
    font-size:.66rem;color:var(--faint);letter-spacing:.06em;
  }
  .micro .ok{color:var(--long)}
  .micro .wait{color:var(--gold-bright)}

  nav{
    display:flex;
    border-top:1px solid var(--border-soft);
    background:rgba(9,13,23,.94);
    backdrop-filter:blur(12px);
    padding:6px 8px calc(10px + env(safe-area-inset-bottom));
  }
  nav a{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 0 6px;color:var(--faint);text-decoration:none;
    font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    min-height:44px;border-radius:8px;transition:color .2s ease;
  }
  nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  nav a.active{color:var(--gold-bright)}
  nav a.active svg{stroke:var(--gold-bright)}
  nav a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
</style>
</head>
<body>
<div class="phone">

  <div class="statusbar">

    <span class="right">

    <!-- ZONE 2: strength -->
    <div class="strength">

  </main>

</body>
