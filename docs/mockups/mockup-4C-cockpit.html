<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>XAU Radar — Mockup 4C: Cockpit</title>
<style>
  /* ══════════ MOCKUP 4C: COCKPIT ══════════
     FUSION 3 — Orbit × Chart: DUAL INSTRUMENTS. A compact orbit
     dial (verdict + arc + blips) stacked over a live chart strip
     carrying the SAME levels as lines; numbers row below.
     Like a cockpit: two gauges, one truth.
     Motion: arc draws in, blips drift slowly, chart draws live. */
  :root{
    --bg:#080B12;
    --panel:#111827;
    --text:#EBF0FA;
    --dim:#8E9FBE;
    --faint:#5A6B8C;
    --gold:#E3B23E;
    --gold-bright:#F5CC60;
    --long:#3BD09A;
    --short:#E85D5D;
    --info:#5E9BFF;
    --track:#1E2947;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#04060B;color:var(--text);
    display:flex;justify-content:center;min-height:100vh;
    font-feature-settings:"tnum" 1;
  }
  .phone{width:390px;max-width:100%;min-height:844px;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}

  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-size:.74rem;color:var(--dim)}
  .statusbar .right{display:flex;gap:6px;align-items:center}

  header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 4px}
  .brand .name{font-size:.9rem;font-weight:800;letter-spacing:.14em}
  .brand .name span{color:var(--gold)}
  .hdr{display:flex;align-items:center;gap:9px}
  .hdr .p{font-family:var(--mono);font-size:1rem;font-weight:700}
  .hdr .c{font-family:var(--mono);font-size:.66rem;font-weight:600;color:var(--long)}
  .live{display:flex;align-items:center;gap:6px;font-size:.6rem;font-weight:700;letter-spacing:.12em;color:var(--long);min-height:44px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--long);box-shadow:0 0 8px rgba(59,208,154,.9);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.live i,.orbit-ring,.arc-fill{animation:none!important}}

  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 20px 12px}

  /* ── instrument 1: compact dial ── */
  .dial{position:relative;width:208px;height:208px;flex-shrink:0;margin-top:2px}
  .dial svg.face{position:absolute;inset:0;width:100%;height:100%}
  .arc-fill{stroke-dasharray:541 880;animation:draw 1.6s ease-out both}
  @keyframes draw{from{stroke-dasharray:0 880}to{stroke-dasharray:541 880}}
  .orbit-ring{position:absolute;inset:9px;animation:spin 34s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blip{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
  .blip.agree{background:var(--long);box-shadow:0 0 8px rgba(59,208,154,.95)}
  .blip.dissent{background:var(--short);box-shadow:0 0 8px rgba(232,93,93,.9)}
  .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
  .core svg{width:20px;height:20px;stroke:var(--gold-bright)}
  .core .word{font-size:1.5rem;font-weight:800;letter-spacing:.1em;color:var(--gold-bright);line-height:1}
  .core .sub{font-size:.64rem;color:var(--dim);margin-top:3px}
  .core .sub b{color:var(--text);font-family:var(--mono)}
  .core .str{font-size:.6rem;font-weight:800;letter-spacing:.12em;color:var(--gold-bright);margin-top:5px}
  .core .str span{font-family:var(--mono);font-weight:600}

  /* connector between instruments */
  .link{display:flex;flex-direction:column;align-items:center;gap:0;margin:2px 0 0}
  .link i{width:1px;height:9px;background:var(--track)}
  .link b{font-size:.58rem;font-weight:700;letter-spacing:.2em;color:var(--faint)}

  /* ── instrument 2: chart strip ── */
  .strip{
    position:relative;width:100%;height:148px;flex-shrink:0;
    background:rgba(255,255,255,.014);
    border:1px solid var(--track);
    border-radius:14px;
    overflow:hidden;
    margin-top:8px;
  }
  #strip{position:absolute;inset:0;width:100%;height:100%;display:block}
  .strip-tag{
    position:absolute;top:8px;left:12px;
    font-size:.58rem;font-weight:700;letter-spacing:.18em;color:var(--dim);
  }

  /* numbers row */
  .numbers{display:flex;gap:10px;width:100%;margin-top:12px}
  .num{flex:1;background:var(--panel);border:1px solid #1A2440;border-radius:12px;padding:11px 4px 9px;text-align:center;min-height:44px;position:relative}
  .num::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2px;border-radius:0 0 3px 3px}
  .num.entry::before{background:var(--info)}
  .num.sl::before{background:var(--short)}
  .num.tp::before{background:var(--long)}
  .num .k{font-size:.58rem;font-weight:700;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  .num .v{font-family:var(--mono);font-size:.88rem;font-weight:700;margin-top:5px}
  .num.entry .v{color:var(--info)}
  .num.sl .v{color:var(--short)}
  .num.tp .v{color:var(--long)}
  .num .s{font-size:.58rem;color:var(--faint);margin-top:2px;font-family:var(--mono)}

  .micro{margin-top:10px;text-align:center;font-size:.62rem;color:var(--faint);letter-spacing:.06em}
  .micro .ok{color:var(--long)}
  .micro .wait{color:var(--gold-bright)}

  .cta{
    margin-top:10px;width:100%;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(160deg,var(--gold-bright),var(--gold));color:#1C1503;
    border:none;border-radius:13px;
    font-weight:800;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;
    padding:15px;min-height:52px;cursor:pointer;
    box-shadow:0 10px 26px -10px rgba(227,178,62,.5);
    transition:filter .18s ease,transform .18s ease;
  }
  .cta:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .cta:active{transform:translateY(0)}
  .cta:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}

  nav{display:flex;border-top:1px solid #16203A;background:rgba(8,12,21,.94);backdrop-filter:blur(12px);padding:6px 8px calc(10px + env(safe-area-inset-bottom));margin-top:12px}
  nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;color:var(--faint);text-decoration:none;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;min-height:44px;border-radius:8px;transition:color .2s ease}
  nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  nav a.active{color:var(--gold-bright)}
  nav a.active svg{stroke:var(--gold-bright)}
  nav a:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>21:47</span><span class="right">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
    <svg width="22" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="3"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M23.5 4v4a2 2 0 0 0 0-4z" fill="currentColor" stroke="none"/></svg>
  </span></div>

  <header>
    <div class="brand"><div class="name">XAU<span>RADAR</span></div></div>
    <div class="hdr">
      <span class="p">4,278.30</span><span class="c">+12.40</span>
      <span class="live" role="status" aria-label="Live"><i aria-hidden="true"></i>LIVE</span>
    </div>
  </header>

  <main>
    <div class="dial" role="img" aria-label="LONG consensus, strong 82 of 100, 4 of 5 sources agree.">
      <svg class="face" viewBox="0 0 330 330" fill="none" aria-hidden="true">
        <circle cx="165" cy="165" r="158" stroke="#232F52" stroke-width="6" stroke-dasharray="2 8.31" opacity=".7"/>
        <circle cx="165" cy="165" r="140" stroke="#1E2947" stroke-width="11" stroke-dasharray="660 880" stroke-linecap="round" transform="rotate(135 165 165)"/>
        <circle class="arc-fill" cx="165" cy="165" r="140" stroke="url(#gg)" stroke-width="11" stroke-linecap="round" transform="rotate(135 165 165)"/>
        <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#B98A2B"/><stop offset="1" stop-color="#F5CC60"/>
        </linearGradient></defs>
        <circle cx="165" cy="165" r="104" stroke="#22304F" stroke-width="1"/>
        <path d="M165 45l5 9h-10l5-9z" fill="#F5CC60"/>
      </svg>
      <div class="orbit-ring" aria-hidden="true">
        <i class="blip agree" style="width:9px;height:9px;left:50%;top:0%"></i>
        <i class="blip agree" style="width:8px;height:8px;left:93%;top:26%"></i>
        <i class="blip agree" style="width:7px;height:7px;left:84%;top:74%"></i>
        <i class="blip agree" style="width:7px;height:7px;left:20%;top:88%"></i>
        <i class="blip dissent" style="width:8px;height:8px;left:5%;top:44%"></i>
      </div>
      <div class="core">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <div class="word">LONG</div>
        <div class="sub"><b>4/5</b> agree</div>
        <div class="str">STRONG <span>82/100</span></div>
      </div>
    </div>

    <div class="link" aria-hidden="true"><i></i><b>SAME LEVELS · LIVE</b><i></i></div>

    <div class="strip">
      <canvas id="strip" role="img" aria-label="Price strip: entry zone 4275 to 4280, stop 4262, first target 4295."></canvas>
      <div class="strip-tag">XAUUSD · 5M</div>
    </div>

    <div class="numbers">
      <div class="num entry"><div class="k">Entry</div><div class="v">4,275–80</div><div class="s">zone</div></div>
      <div class="num sl"><div class="k">Stop</div><div class="v">4,262</div><div class="s">−16 pts</div></div>
      <div class="num tp"><div class="k">Targets</div><div class="v">4,295 +</div><div class="s">3 levels</div></div>
    </div>

    <div class="micro">1H <span class="ok">SUPPORTIVE</span> · 5M <span class="wait">READY</span> · updated 14s ago</div>

    <button class="cta" type="button">View Full Setup
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </main>

  <nav aria-label="Primary">
    <a href="#" class="active" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>Radar</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Signal</a>
    <a href="#"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Sources</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>History</a>
    <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.23.6.83 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>Settings</a>
  </nav>
</div>

<script>
(function(){
  var cv = document.getElementById('strip');
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var P_MIN = 4255, P_MAX = 4300;
  var ENTRY_LO = 4275, ENTRY_HI = 4280, SL = 4262, TP1 = 4295;
  var N = 70;
  var prices = [];
  (function seed(){
    var p = 4259;
    for (var i = 0; i < N; i++){
      p += (Math.sin(i*.3)*.35 + (Math.random()-.42)*.9 + .18);
      if (p < 4257) p = 4257 + Math.random();
      if (p > 4284) p = 4284 - Math.random();
      prices.push(p);
    }
  })();
  function size(){
    var r = cv.parentElement.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function y(p, H){ var pad = 12; return pad + (1 - (p - P_MIN) / (P_MAX - P_MIN)) * (H - pad*2); }
  function draw(progress){
    var W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0,0,W,H);
    var ey1 = y(ENTRY_HI,H), ey2 = y(ENTRY_LO,H);
    ctx.fillStyle = 'rgba(227,178,62,.14)'; ctx.fillRect(0,ey1,W,ey2-ey1);
    ctx.fillStyle = 'rgba(227,178,62,.8)'; ctx.font = '600 9px Inter, sans-serif';
    ctx.fillText('ENTRY', 8, ey1 - 4);
    ctx.strokeStyle = 'rgba(232,93,93,.7)'; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(0,y(SL,H)); ctx.lineTo(W,y(SL,H)); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = 'rgba(232,93,93,.9)';
    ctx.fillText('SL', 8, y(SL,H) - 4);
    ctx.strokeStyle = 'rgba(59,208,154,.6)'; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(0,y(TP1,H)); ctx.lineTo(W,y(TP1,H)); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = 'rgba(59,208,154,.9)';
    ctx.fillText('TP1', 8, y(TP1,H) - 4);
    var count = Math.max(2, Math.floor(N * progress));
    var x = function(i){ return 6 + (W-12) * i/(N-1); };
    var lg = ctx.createLinearGradient(0,0,W,0);
    lg.addColorStop(0,'rgba(94,155,255,.3)'); lg.addColorStop(1,'#E3B23E');
    ctx.strokeStyle = lg; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.beginPath();
    for (var i = 0; i < count; i++){ var px = x(i), py = y(prices[i],H); i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); }
    ctx.stroke();
    var lx = x(count-1), ly = y(prices[count-1],H);
    ctx.fillStyle = '#E3B23E'; ctx.beginPath(); ctx.arc(lx,ly,3.5,0,7); ctx.fill();
  }
  size(); window.addEventListener('resize', function(){ size(); draw(1); });
  if (reduce){ draw(1); return; }
  var start = null;
  function frame(ts){
    if (!start) start = ts;
    var p = Math.min(1, (ts - start) / 2400);
    draw(p);
    window.__stripProgress = p;
    if (p < 1) requestAnimationFrame(frame);
    else setTimeout(function(){ start = null; requestAnimationFrame(frame); }, 2600);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
